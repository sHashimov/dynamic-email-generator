spring:
  application:
    name: dynamic-email-generator
  profiles:
    active: dev
  config:
    import: optional:application-${spring.profiles.active}.yml

server:
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,env
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: false
    diskspace:
      enabled: true

logging:
  level:
    org.springdoc: DEBUG
