version: '3.8'

services:
  email-service:
    image: dynamic-email-generator
    build:
      context: ..
      dockerfile: docker/Dockerfile
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SWAGGER_ENABLED=true
    ports:
      - "8080:8080"

  nginx:
    image: nginx:latest
    depends_on:
      - email-service
    ports:
      - "9443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ../nginx/certs:/etc/nginx/ssl
