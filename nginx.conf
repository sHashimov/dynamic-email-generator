server {
    listen 80;

    location / {
        proxy_pass http://email-generator-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        proxy_pass http://email-generator-app:8080/v3/api-docs;
    }

    location /swagger-ui/ {
        proxy_pass http://email-generator-app:8080/swagger-ui/;
    }

    location /swagger-ui.html {
        proxy_pass http://email-generator-app:8080/swagger-ui.html;
    }
}
