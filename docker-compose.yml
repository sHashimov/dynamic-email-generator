version: '3.8'

services:
  app:
    image: dynamic-email-generator
    build:
      context: .
    container_name: email-generator-app
    ports:
      - "8080:8080"

  nginx:
    image: nginx:alpine
    container_name: email-generator-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
