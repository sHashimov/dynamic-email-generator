version: '3.8'

services:
  app:
    image: dynamic-email-generator
    build:
      context: .
    container_name: email-generator-app
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SWAGGER_ENABLED=true
    ports:
      - "8080:8080"
  nginx:
    image: nginx:latest
    container_name: email-generator-nginx
    depends_on:
      - app
    ports:
      - "9443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/ssl
